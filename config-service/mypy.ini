# mypy settings for the backend and the MCP server. Run with `make typecheck`
# from config-service/, which invokes mypy once per project from that project's
# own venv — the MCP server's imports (mcp, pytest) only resolve inside its venv.
#
# Scope note: without django-stubs, mypy treats Django's untyped imports as Any,
# so it barely checks backend/api/. The real value lands on knowledge_graph/ and
# the MCP server. Tightening this (django-stubs, strict mode) is deferred.

[mypy]
python_version = 3.14
ignore_missing_imports = True
mypy_path = backend
exclude = (venv|migrations)/

# knowledge_graph must genuinely resolve, not silently degrade to Any: the MCP
# server reaches it through a runtime sys.path insert that mypy cannot follow on
# its own (that is what mypy_path above is for). If this import ever stops
# resolving, fail loudly instead of type-checking nothing.
[mypy-knowledge_graph.*]
ignore_missing_imports = False
